[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster"
version = "1.54.0"
description = "Physics-guided antenna design and optimisation library (design side, no GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hawse1337"}]
dependencies = ["numpy>=2.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
optimizer = ["pymoo>=0.6,<0.7", "scipy>=1.11"]
surrogate = ["scikit-learn>=1.4"]
acquisition = ["torch>=2.0", "botorch>=0.13", "gpytorch>=1.11"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]
guard-client = ["mcp>=1.0,<2"]

[project.scripts]
aster = "aster.cli:main"

[tool.setuptools]
packages = [
    "aster", "aster.benchmark", "aster.cases", "aster.interop",
    "aster.optimizer", "aster.parametric", "aster.physics",
    "aster.runtime", "aster.skills", "aster.surrogate", "aster.topology",
]

[tool.setuptools.package-data]
"aster.skills" = ["**/*"]
"aster.cases" = ["*.json"]
aster = ["skills/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
