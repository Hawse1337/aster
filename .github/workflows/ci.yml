name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[optimizer,surrogate,plot,dev]"
      - name: Offline tests
        # test_progress spawns a short-lived external process to sample live progress; on a
        # shared runner that process can be unavailable, so it is excluded here.
        run: >-
          python -m pytest tests -q
          -k "not test_a_real_process_yields_numbers"
