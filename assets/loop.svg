<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="aster loop: design, solve, keep, judge, re-target">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#f1ece1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#c26b3f"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <rect width="1200" height="430" fill="url(#paper)"/>
  <g stroke="#c9bfa8" stroke-opacity="0.28" stroke-width="1">
    <path d="M0 360 H1200"/>
  </g>

  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#23262b" letter-spacing="-0.3">One study, five stations</text>
  <text x="60" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#6b6557">The loop is ordinary Python; the solver is a guarded service and the measurements are kept.</text>

  <!-- station cards -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(60 132)">
      <rect width="176" height="108" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
      <text x="18" y="34" font-size="13" font-weight="700" fill="#c26b3f" letter-spacing="1.2">01 DESIGN</text>
      <text x="18" y="62" font-size="13.5" fill="#3a3f47">ParamSpec · ParamSpace</text>
      <text x="18" y="84" font-size="13.5" fill="#3a3f47">Objective · Constraint</text>
    </g>
    <g transform="translate(268 132)">
      <rect width="176" height="108" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
      <text x="18" y="34" font-size="13" font-weight="700" fill="#c26b3f" letter-spacing="1.2">02 SOLVE</text>
      <text x="18" y="62" font-size="13.5" fill="#3a3f47">guarded AEDT run</text>
      <text x="18" y="84" font-size="13.5" fill="#3a3f47">explicit PID / port</text>
    </g>
    <g transform="translate(476 132)">
      <rect width="176" height="108" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
      <text x="18" y="34" font-size="13" font-weight="700" fill="#c26b3f" letter-spacing="1.2">03 KEEP</text>
      <text x="18" y="62" font-size="13.5" fill="#3a3f47">S11 · far field</text>
      <text x="18" y="84" font-size="13.5" fill="#3a3f47">native reports</text>
    </g>
    <g transform="translate(684 132)">
      <rect width="176" height="108" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
      <text x="18" y="34" font-size="13" font-weight="700" fill="#c26b3f" letter-spacing="1.2">04 JUDGE</text>
      <text x="18" y="62" font-size="13.5" fill="#3a3f47">band acceptance</text>
      <text x="18" y="84" font-size="13.5" fill="#3a3f47">pattern acceptance</text>
    </g>
    <g transform="translate(892 132)">
      <rect width="176" height="108" rx="12" fill="#eef7f4" stroke="#8bbfae"/>
      <text x="18" y="34" font-size="13" font-weight="700" fill="#2a9d8f" letter-spacing="1.2">05 RE-TARGET</text>
      <text x="18" y="62" font-size="13.5" fill="#3a3f47">new rules, same runs</text>
      <text x="18" y="84" font-size="13.5" fill="#3a3f47">no re-solve needed</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#c26b3f" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 240 186 H 262"/>
    <path d="M 448 186 H 470"/>
    <path d="M 656 186 H 678"/>
    <path d="M 864 186 H 886"/>
  </g>

  <!-- feedback loop: archive returns to design -->
  <g fill="none" stroke="#2a9d8f" stroke-width="1.6" marker-end="url(#arrowLoop)">
    <path d="M 980 240 V 292 H 148 V 246"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#2a9d8f">
    <text x="480" y="286">archive.sqlite → next generation (history is reusable)</text>
  </g>

  <!-- torus mark -->
  <g transform="translate(1086 320)">
    <ellipse cx="0" cy="0" rx="52" ry="19" fill="none" stroke="#c26b3f" stroke-opacity="0.7" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="32" ry="11" fill="none" stroke="#2a9d8f" stroke-opacity="0.6" stroke-width="1.2"/>
    <path d="M -58 0 L 58 0" stroke="#c26b3f" stroke-opacity="0.35" stroke-dasharray="2 4"/>
    <path d="M 0 -22 L 0 22" stroke="#c26b3f" stroke-opacity="0.35" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="3" fill="#c26b3f"/>
  </g>

  <!-- paper footer rule -->
  <g stroke="#c9bfa8" stroke-opacity="0.5" stroke-width="1">
    <path d="M60 396 H1140"/>
  </g>
  <text x="60" y="416" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a8272">aster · design-side library · the solver lives in ansys-aedt-mcp</text>
</svg>
